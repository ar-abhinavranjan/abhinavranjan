<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog Removed</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: #e5e7eb;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    .card {
      max-width: 720px;
      padding: 2rem 2.5rem;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }
    h1 { margin-top: 0; }
    p { line-height: 1.7; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Blog Removed</h1>
    <p>This article has been removed and is no longer part of the active AR. blog collection.</p>
  </div>
</body>
</html>
