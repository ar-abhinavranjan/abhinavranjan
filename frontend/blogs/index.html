<style>
  /* Blog Page Specific Enhancements aligned with Global Theme */
  .blog-controls-wrapper {
    max-width: 680px;
    margin: 0 auto 3rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .blog-search-box {
    position: relative;
    width: 100%;
  }

  .blog-search-box input {
    width: 100%;
    padding: 1.1rem 1.5rem 1.1rem 3.2rem;
    background: var(--card-bg, #121212);
    border: 1px solid var(--border, #27272a);
    border-radius: 50px;
    color: var(--text-main, #ffffff);
    font-family: inherit;
    font-size: 1rem;
    outline: none;
    transition: all var(--transition-fast, 0.2s ease);
  }

  .blog-search-box input:focus {
    border-color: var(--primary, #6366f1);
    box-shadow: 0 0 20px rgba(99, 102, 241, 0.25);
  }

  .blog-search-box i {
    position: absolute;
    left: 1.3rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted, #a1a1aa);
    pointer-events: none;
  }

  .blog-filters {
    display: flex;
    justify-content: center;
    gap: 0.7rem;
    flex-wrap: wrap;
  }

  .blog-filter-btn {
    padding: 0.55rem 1.3rem;
    border-radius: 50px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border, #27272a);
    color: var(--text-muted, #a1a1aa);
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition-fast, 0.2s ease);
  }

  .blog-filter-btn:hover,
  .blog-filter-btn.active {
    background: var(--primary, #6366f1);
    color: #ffffff;
    border-color: var(--primary, #6366f1);
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
  }

  .blog-stats-counter {
    text-align: center;
    color: var(--text-muted, #a1a1aa);
    font-size: 0.9rem;
    letter-spacing: 0.3px;
  }

  /* Cards Grid */
  .blogs-grid-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 2.2rem;
    margin-bottom: 5rem;
  }

  .blog-card {
    background: var(--card-bg, #121212);
    border: 1px solid var(--border, #27272a);
    border-radius: 20px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: transform var(--transition-medium, 0.3s ease), border-color var(--transition-medium, 0.3s ease), box-shadow var(--transition-medium, 0.3s ease);
    display: flex;
    flex-direction: column;
  }

  .blog-card:hover {
    transform: translateY(-8px);
    border-color: rgba(99, 102, 241, 0.5);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(99, 102, 241, 0.2);
  }

  .blog-card-img {
    width: 100%;
    height: 220px;
    overflow: hidden;
    position: relative;
    background: #0d0d14;
  }

  .blog-card-img img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: rgba(0, 0, 0, 0.4);
    transition: transform 0.5s ease;
  }

  .blog-card:hover .blog-card-img img {
    transform: scale(1.08);
  }

  .blog-category {
    position: absolute;
    top: 1rem;
    right: 1rem;
    padding: 0.35rem 0.8rem;
    background: var(--primary, #6366f1);
    color: #ffffff;
    border-radius: 8px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
  }

  .blog-card-content {
    padding: 1.8rem;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
  }

  .blog-date {
    font-size: 0.85rem;
    color: var(--primary, #6366f1);
    font-weight: 600;
    margin-bottom: 0.6rem;
    display: block;
  }

  .blog-card-content h3 {
    font-size: 1.35rem;
    font-weight: 700;
    margin-bottom: 0.8rem;
    line-height: 1.4;
    color: var(--text-main, #ffffff);
  }

  .blog-card-content p {
    font-size: 0.95rem;
    color: var(--text-muted, #a1a1aa);
    line-height: 1.6;
    margin-bottom: 1.5rem;
    flex-grow: 1;
  }

  .blog-card-footer {
    color: var(--primary, #6366f1);
    font-weight: 600;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: auto;
  }

  .blog-card-footer i {
    transition: transform var(--transition-fast, 0.2s ease);
  }

  .blog-card:hover .blog-card-footer i {
    transform: translateX(5px);
  }

  @media (max-width: 768px) {
    .blogs-grid-container {
      grid-template-columns: 1fr;
    }
  }
</style>
