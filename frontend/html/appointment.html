  <main>
    <section class="section appointment-section" id="booking-standalone">
      <div class="container">
        <h1 class="section-title fade-in-up">Book an Appointment</h1>
        <p class="section-subtitle fade-in-up delay-100">Schedule a 1-on-1 technical advisory session, security audit, research discussion, or partnership consultation with AR. Abhinav Ranjan.</p>

        <div class="appointment-card-wrapper fade-in-up delay-150">
          <form id="appointmentForm" novalidate>
            <div class="appointment-grid">
              <div class="form-group">
                <label for="apptName">Full Name <span style="color: #ef4444;">*</span></label>
                <input id="apptName" name="apptName" placeholder="Your full name..." required type="text" />
              </div>

              <div class="form-group">
                <label for="apptEmail">Email Address <span style="color: #ef4444;">*</span></label>
                <input id="apptEmail" name="apptEmail" placeholder="your.email@domain.com" required type="email" />
              </div>

              <div class="form-group">
                <label for="apptPhone">Phone Number <span style="color: #ef4444;">*</span></label>
                <input id="apptPhone" name="apptPhone" placeholder="+91 XXXXX XXXXX" required type="tel" />
              </div>

              <div class="form-group">
                <label for="apptDate">Preferred Date & Time <span style="color: #ef4444;">*</span></label>
                <input id="apptDate" name="apptDate" required type="datetime-local" />
              </div>

              <div class="form-group full-width">
                <label for="apptReason">Reason for Appointment <span style="color: #ef4444;">*</span></label>
                <select id="apptReason" name="apptReason" required style="width:100%;padding:1.1rem;background:var(--card-bg,#121212);border:1px solid var(--border,#27272a);border-radius:12px;color:var(--text-main,#fff);font-family:inherit;">
                  <option value="Cybersecurity Audit & Advisory">Cybersecurity Audit & Advisory</option>
                  <option value="Research & Technical Collaboration">Research & Technical Collaboration</option>
                  <option value="Luminary Technicals Partnership">Luminary Technicals Partnership</option>
                  <option value="Speaking Engagement & Keynote">Speaking Engagement & Keynote</option>
                  <option value="Mentorship & Educational Consultation">Mentorship & Educational Consultation</option>
                  <option value="Other Technical Inquiry">Other Technical Inquiry</option>
                </select>
              </div>

              <div class="form-group full-width">
                <label for="apptNotes">Additional Details & Notes</label>
                <textarea id="apptNotes" name="apptNotes" placeholder="Share background details or specific topics to discuss..." rows="4"></textarea>
              </div>
            </div>

            <div class="appointment-form-actions">
              <button class="btn btn-primary btn-block" id="apptWhatsapp" type="button">
                <i class="fab fa-whatsapp"></i>
                <span>Request via WhatsApp (Fast)</span>
              </button>
              <button class="btn btn-secondary btn-block" id="apptTelegram" type="button">
                <i class="fab fa-telegram"></i>
                <span>Request via Telegram (Fast)</span>
              </button>
              <button class="btn btn-secondary btn-block" id="apptEmailBtn" type="button">
                <i class="fas fa-envelope"></i>
                <span>Request via Email</span>
              </button>
              <button class="btn btn-secondary btn-block" id="apptWebBtn" type="button">
                <i class="fas fa-paper-plane"></i>
                <span>Submit via Website</span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </section>
